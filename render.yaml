# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
services:
  - type: web
    name: asterisk-analyst
    runtime: node
    plan: 0.5c-512mb
    region: oregon
    autoDeployTrigger: checksPass
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 24.14.1
      - key: ASTERISK_USERS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: asterisk-ledger
          property: connectionString
  - type: cron
    name: asterisk-matchday
    runtime: node
    plan: 0.5c-512mb
    region: oregon
    autoDeployTrigger: checksPass
    schedule: "*/15 * * * *"
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run daily -- --refresh
    envVars:
      - key: NODE_VERSION
        value: 24.14.1
      - key: DATABASE_URL
        fromDatabase:
          name: asterisk-ledger
          property: connectionString
databases:
  - name: asterisk-ledger
    region: oregon
    plan: 0.1c-256mb
    diskSizeGB: 1
    postgresMajorVersion: "18"
    databaseName: asterisk
    user: asterisk
    ipAllowList: []
